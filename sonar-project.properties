# Configuración de SonarQube / SonarCloud para el monorepo (backend Java + frontend React)
sonar.projectKey=soft-quality_weather-app
sonar.organization=soft-quality
sonar.projectName=weather-app
sonar.sourceEncoding=UTF-8

# ── Código fuente y pruebas ───────────────────────────────────────────
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,backend/src/performanceTest/java,backend/src/acceptanceTest/java,frontend/src
sonar.test.inclusions=backend/src/test/**,backend/src/performanceTest/**,backend/src/acceptanceTest/java/**,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx
sonar.exclusions=frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/test/**,frontend/src/**/*.css

# ── Backend (Java + JaCoCo) ───────────────────────────────────────────
sonar.java.source=17
sonar.java.libraries=backend/build/sonar-libraries/main/*.jar
sonar.java.test.libraries=backend/build/sonar-libraries/test/*.jar
sonar.java.binaries=backend/build/classes/java/main
sonar.java.test.binaries=backend/build/classes/java/test,backend/build/classes/java/performanceTest,backend/build/classes/java/acceptanceTest
sonar.coverage.jacoco.xmlReportPaths=backend/build/reports/jacoco/test/jacocoTestReport.xml

# ── Frontend (Vitest + cobertura V8 en formato lcov) ──────────────────
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# ── Exclusiones de cobertura ──────────────────────────────────────────
# Punto de entrada sin lógica (main) en ambos lados
sonar.coverage.exclusions=backend/src/main/java/com/weatherapp/backend/BackendApplication.java,frontend/src/main.jsx
